<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Multimeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#E7E9EC}
#fit{width:100%;overflow:hidden}
#stage{width:940px;height:1000px;transform-origin:top left}
button,select,input{font-family:Inter,system-ui,sans-serif}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2F6FD6;outline-offset:2px}
</style>
</head>
<body>
<div id="fit"><div id="stage">
<div style="width:940px;height:1000px;box-sizing:border-box;padding:30px;background:#E7E9EC;display:flex;align-items:flex-start;justify-content:center;gap:30px;font-family:Inter,system-ui,sans-serif">
  <div style="width:500px;flex-shrink:0;box-sizing:border-box;padding:18px;border-radius:48px;background:#E9B52A;box-shadow:0 24px 50px rgba(0,0,0,0.25),inset 0 -6px 0 rgba(0,0,0,0.12)">
    <div style="box-sizing:border-box;padding:20px 22px 24px;border-radius:32px;background:#2A2D32;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;color:#C9CDD3;font-size:12px;font-weight:700;letter-spacing:0.18em"><span>DIGITAL MULTIMETER</span><span style="color:#F5C84B">3½ DIGIT</span></div>
      <div id="lcdBox" style="height:140px;box-sizing:border-box;border-radius:10px;border:6px solid #15171A;box-shadow:inset 0 3px 10px rgba(0,0,0,0.35);padding:12px 28px;display:flex;align-items:center">
        <div id="lcd" style="flex:1;font-family:'Share Tech Mono',monospace;font-size:84px;line-height:1;color:#1C2416"></div>
      </div>
      <div id="dial" style="position:relative;width:420px;height:420px;align-self:center"></div>
      <div id="ports" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:6px;border-top:1px solid #3A3E44"></div>
    </div>
  </div>
  <div style="width:340px;flex-shrink:0;box-sizing:border-box;padding:24px;border-radius:16px;background:#FFFFFF;box-shadow:0 6px 18px rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:22px;color:#1B1D20">
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:16px;font-weight:800">Input to the meter</h2>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A4F57">Quantity
        <select id="q" style="height:44px;padding:0 10px;border-radius:8px;border:1px solid #A8ADB3;background:#FFFFFF;font-size:14px;color:#1B1D20"></select></label>
      <div style="display:flex;gap:10px">
        <label style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A4F57">Value
          <input id="val" type="number" step="any" style="height:44px;box-sizing:border-box;padding:0 10px;border-radius:8px;border:1px solid #A8ADB3;font-size:14px;color:#1B1D20;width:100%;background:#FFFFFF"></label>
        <label style="width:96px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A4F57">Unit
          <select id="u" style="height:44px;padding:0 10px;border-radius:8px;border:1px solid #A8ADB3;background:#FFFFFF;font-size:14px;color:#1B1D20"></select></label>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid #E1E3E6">
      <h2 style="margin:0;font-size:16px;font-weight:800">Test leads</h2>
      <span style="font-size:13px;color:#4A4F57">Choose a lead, then click a socket on the meter.</span>
      <div style="display:flex;gap:10px">
        <button type="button" id="pickRed" style="flex:1;height:44px;border-radius:8px;background:#FFFFFF;font-size:14px;font-weight:700;color:#1B1D20;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:#D93A3A"></span>Red lead</button>
        <button type="button" id="pickBlack" style="flex:1;height:44px;border-radius:8px;background:#FFFFFF;font-size:14px;font-weight:700;color:#1B1D20;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:#1A1A1A"></span>Black lead</button>
      </div>
      <span id="leadStatus" style="font-size:13px;color:#4A4F57"></span>
      <button type="button" id="unplug" style="height:40px;border-radius:8px;border:1px solid #A8ADB3;background:#F4F5F7;font-size:13px;font-weight:700;color:#1B1D20;cursor:pointer">Unplug both leads</button>
    </div>
  </div>
</div>
</div></div>
<script>
(()=>{
var AR=[['2m',2,1e-3,'mA',3],['20m',20,1e-3,'mA',2],['200m',200,1e-3,'mA',1],['10A',10,1,'A',2]];
var SECT=[
 {g:'off',key:'OFF',ranges:[['OFF']]},
 {g:'v',key:'VDC',main:'V',dc:true,code:'VDC',ranges:[['200m',200,1e-3,'mV',1],['2',2,1,'V',3],['20',20,1,'V',2],['200',200,1,'V',1],['1000',1000,1,'V',0]]},
 {g:'v',key:'VAC',main:'V',ac:true,code:'VAC',ranges:[['2',2,1,'V',3],['20',20,1,'V',2],['200',200,1,'V',1],['750',750,1,'V',0]]},
 {g:'r',key:'OHM',main:'Ω',code:'OHMS',ranges:[['200',200,1,'Ω',1],['2k',2,1e3,'kΩ',3],['20k',20,1e3,'kΩ',2],['200k',200,1e3,'kΩ',1],['2000k',2000,1e3,'kΩ',0]]},
 {g:'r',key:'CONT',cont:true,ranges:[['',200,1,'Ω',1]]},
 {g:'a',key:'ADC',main:'A',dc:true,code:'ADC',ranges:AR},
 {g:'a',key:'AAC',main:'A',ac:true,code:'AAC',ranges:AR}];
var COL={off:'#C9CDD3',v:'#F5C84B',r:'#8ED1C6',a:'#F4A291'};
var POS=[];SECT.forEach(function(s){s.ranges.forEach(function(r){POS.push({s:s,lbl:r[0],full:r[1],scale:r[2],unit:r[3],dec:r[4],id:s.key+':'+r[0]});});});
var STEP=360/POS.length,C=210;
function xy(a,rad,w,h){var r=a*Math.PI/180;return {x:(C+rad*Math.sin(r)-w/2).toFixed(1),y:(C-rad*Math.cos(r)-h/2).toFixed(1)};}
var QTY={dcv:{t:'DC voltage',dial:['VDC'],units:{mV:1e-3,V:1},dc:true},acv:{t:'AC voltage',dial:['VAC'],units:{mV:1e-3,V:1}},
 ohm:{t:'Resistance',dial:['OHM','CONT'],units:{'Ω':1,'kΩ':1e3,'MΩ':1e6}},dca:{t:'DC current',dial:['ADC'],units:{mA:1e-3,A:1},dc:true},aca:{t:'AC current',dial:['AAC'],units:{mA:1e-3,A:1}}};
var DEFU={dcv:'V',acv:'V',ohm:'kΩ',dca:'mA',aca:'mA'};
var PORTS=[{id:'10A',lbl:'10A',ring:'#D93A3A',note:'FUSED'},{id:'mA',lbl:'mA',ring:'#D93A3A',note:'FUSED'},{id:'COM',lbl:'COM',ring:'#15171A',note:''},{id:'VO',lbl:'VΩ',ring:'#D93A3A',note:''}];
function fmt(x,cur){var d=x/cur.scale,p=Math.pow(10,cur.dec),counts=Math.round(Math.abs(d)*p);
 if(counts>=2000)return {t:'1',over:true};var s=(counts/p).toFixed(cur.dec);return {t:(d<0&&counts>0?'-':'')+s,over:false};}
var S={sel:'VDC:20',q:'dcv',u:'V',val:'12.0',red:null,black:null,placing:'red'};
var $=function(id){return document.getElementById(id);};
var DC='<svg width="16" height="13" viewBox="0 0 18 14" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="currentColor" stroke-width="2"></line><circle cx="3" cy="10" r="1.6" fill="currentColor"></circle><circle cx="9" cy="10" r="1.6" fill="currentColor"></circle><circle cx="15" cy="10" r="1.6" fill="currentColor"></circle></svg>';
var AC='<svg width="16" height="13" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 7 C 4 1.5, 7 1.5, 9 7 S 14 12.5, 17 7" fill="none" stroke="currentColor" stroke-width="2"></path></svg>';
var CONT='<svg width="24" height="14" viewBox="0 0 28 16" aria-hidden="true"><polygon points="2,2 2,14 11,8" fill="currentColor"></polygon><line x1="12" y1="2" x2="12" y2="14" stroke="currentColor" stroke-width="2"></line><path d="M17 4 Q 20 8 17 12" fill="none" stroke="currentColor" stroke-width="1.8"></path><path d="M21 2 Q 26 8 21 14" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>';
function render(){
 var idx=Math.max(0,POS.findIndex(function(p){return p.id===S.sel;})),o='';
 o+='<div style="position:absolute;left:44px;top:44px;width:332px;height:332px;border-radius:50%;background:#23262A;box-shadow:inset 0 0 0 2px #3A3E44"></div>';
 SECT.forEach(function(sc){var ii=[];POS.forEach(function(p,i){if(p.s===sc)ii.push(i);});
  var a0=(ii[0]*STEP-5)*Math.PI/180,a1=(ii[ii.length-1]*STEP+5)*Math.PI/180,R=124;
  var d='M '+(C+R*Math.sin(a0)).toFixed(1)+' '+(C-R*Math.cos(a0)).toFixed(1)+' A '+R+' '+R+' 0 0 1 '+(C+R*Math.sin(a1)).toFixed(1)+' '+(C-R*Math.cos(a1)).toFixed(1);
  o+='<svg width="420" height="420" viewBox="0 0 420 420" aria-hidden="true" style="position:absolute;left:0;top:0;pointer-events:none"><path d="'+d+'" fill="none" stroke="'+COL[sc.g]+'" stroke-width="5" stroke-linecap="round"></path></svg>';});
 POS.forEach(function(p,i){var prev=POS[(i-1+POS.length)%POS.length];
  if(prev.s!==p.s)o+='<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;transform:rotate('+((i-0.5)*STEP).toFixed(2)+'deg)"><div style="position:absolute;left:209px;top:8px;width:2px;height:90px;background:#8A9099"></div></div>';});
 POS.forEach(function(p,i){var on=i===idx;
  o+='<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;transform:rotate('+(i*STEP).toFixed(2)+'deg)"><div style="position:absolute;left:208px;top:96px;width:4px;height:12px;border-radius:2px;background:'+(on?COL[p.s.g]:'#6B7078')+'"></div></div>';});
 SECT.filter(function(s){return s.code;}).forEach(function(s){var angs=[];POS.forEach(function(p,i){if(p.s===s)angs.push(i*STEP);});
  var pt=xy((angs[0]+angs[angs.length-1])/2,190,50,32);
  o+='<div aria-hidden="true" style="position:absolute;left:'+pt.x+'px;top:'+pt.y+'px;width:50px;height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:'+COL[s.g]+'"><span style="display:flex;align-items:center;gap:2px;font-size:16px;font-weight:800;line-height:1">'+s.main+(s.dc?DC:'')+(s.ac?AC:'')+'</span><span style="font-size:9px;font-weight:700;letter-spacing:0.06em">'+s.code+'</span></div>';});
 POS.forEach(function(p,i){var a=i*STEP,on=i===idx,c=COL[p.s.g],pt=xy(a,146,36,20);
  var aria=p.s.key==='OFF'?'Off':p.s.cont?'Continuity and diode':(p.s.code+' '+p.lbl+' range');
  o+='<button type="button" data-pos="'+i+'" aria-label="'+aria+'" aria-pressed="'+on+'" style="position:absolute;left:'+pt.x+'px;top:'+pt.y+'px;width:36px;height:20px;box-sizing:border-box;border:0;border-radius:5px;cursor:pointer;padding:0;font-size:11px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;justify-content:center;color:'+(on?'#1B1D20':c)+';background:'+(on?c:'transparent')+'">'+p.lbl+(p.s.cont?CONT:'')+'</button>';});
 o+='<button type="button" id="knob" aria-label="Turn dial to next setting" style="position:absolute;left:118px;top:118px;width:184px;height:184px;box-sizing:border-box;padding:0;border-radius:50%;border:6px solid #3A3E44;background:#1A1C20;box-shadow:0 10px 22px rgba(0,0,0,0.5);cursor:grab;transition:transform 0.3s ease;transform:rotate('+(idx*STEP).toFixed(2)+'deg)"><div style="position:absolute;left:69px;top:4px;width:34px;height:164px;border-radius:17px;background:#33373D;box-shadow:inset 0 2px 0 rgba(255,255,255,0.08);pointer-events:none"><div style="position:absolute;left:14px;top:8px;width:6px;height:40px;border-radius:3px;background:#FFFFFF"></div></div></button>';
 $('dial').innerHTML=o;
 // reading
 var cur=POS[idx],s=cur.s,off=s.key==='OFF',Q=QTY[S.q],mult=Q.units[S.u]||1,x=parseFloat(S.val);if(!isFinite(x))x=0;x*=mult;
 var need=s.g==='a'?(cur.unit==='A'?'10A':'mA'):'VO';
 var leadsOk=(S.red===need&&S.black==='COM')||(S.red==='COM'&&S.black===need),flipped=S.red==='COM',dialOk=Q.dial.indexOf(s.key)>=0,out={t:'',over:false};
 if(!off){if(dialOk&&leadsOk){out=fmt((Q.dc&&flipped)?-x:x,cur);if(s.g==='r'&&x<0)out={t:'1',over:true};}
  else if(s.g==='r')out={t:'1',over:true};else out=fmt(0,cur);}
 $('lcdBox').style.background=off?'#97A284':'#C3D0A9';$('lcd').textContent=out.t;$('lcd').style.textAlign=out.over?'left':'right';
 // ports
 $('ports').innerHTML=PORTS.map(function(p){var hr=S.red===p.id,hb=S.black===p.id,plug=hr||hb;
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px"><span style="color:#FFFFFF;font-size:15px;font-weight:800">'+p.lbl+'</span>'+
  '<button type="button" data-port="'+p.id+'" aria-label="'+p.lbl+' socket'+(hr?', red lead plugged in':hb?', black lead plugged in':'')+'" style="position:relative;width:54px;height:54px;box-sizing:border-box;padding:0;border-radius:50%;border:8px solid '+p.ring+';background:#0B0C0E;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #4A4F57;cursor:pointer"><span style="width:16px;height:16px;border-radius:50%;background:#000000;box-shadow:0 0 0 3px #8E949B"></span>'+
  (plug?'<span style="position:absolute;left:-2px;top:-2px;width:42px;height:42px;box-sizing:border-box;border-radius:50%;background:'+(hr?'#D93A3A':'#1A1A1A')+';border:3px solid '+(hr?'#F08A8A':'#5A5F66')+';box-shadow:0 4px 8px rgba(0,0,0,0.5)"></span>':'')+'</button>'+
  '<span style="min-height:14px;color:#C9CDD3;font-size:10px;font-weight:700;letter-spacing:0.12em">'+p.note+'</span><span aria-hidden="true" style="width:10px;height:36px;border-radius:0 0 5px 5px;background:'+(hr?'#D93A3A':hb?'#111111':'transparent')+'"></span></div>';}).join('');
 // side panel
 $('q').innerHTML=Object.keys(QTY).map(function(k){return '<option value="'+k+'"'+(k===S.q?' selected':'')+'>'+QTY[k].t+'</option>';}).join('');
 $('u').innerHTML=Object.keys(Q.units).map(function(k){return '<option value="'+k+'"'+(k===S.u?' selected':'')+'>'+k+'</option>';}).join('');
 if(document.activeElement!==$('val'))$('val').value=S.val;
 [['pickRed','red'],['pickBlack','black']].forEach(function(b){var on=S.placing===b[1];$(b[0]).setAttribute('aria-pressed',on);$(b[0]).style.border='2px solid '+(on?'#2F6FD6':'#C9CDD3');});
 function nm(id){var p=PORTS.find(function(z){return z.id===id;});return p?p.lbl:'not plugged in';}
 $('leadStatus').textContent='Red: '+nm(S.red)+' · Black: '+nm(S.black);
}
function set(o){Object.assign(S,o);render();}
$('dial').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.id==='knob'){var idx=Math.max(0,POS.findIndex(function(p){return p.id===S.sel;}));set({sel:POS[(idx+1)%POS.length].id});}
 else if(b.dataset.pos!=null)set({sel:POS[+b.dataset.pos].id});});
$('ports').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id=b.dataset.port,lead=S.placing,other=lead==='red'?'black':'red',upd={};
 if(S[lead]===id)upd[lead]=null;else{upd[lead]=id;if(S[other]===id)upd[other]=null;}set(upd);});
$('q').addEventListener('change',function(e){set({q:e.target.value,u:DEFU[e.target.value]});});
$('u').addEventListener('change',function(e){set({u:e.target.value});});
$('val').addEventListener('change',function(e){set({val:e.target.value});});
$('pickRed').onclick=function(){set({placing:'red'});};
$('pickBlack').onclick=function(){set({placing:'black'});};
$('unplug').onclick=function(){set({red:null,black:null});};
function fit(){var w=$('fit').clientWidth,s=Math.min(1,w/940),st=$('stage');
 st.style.transform='scale('+s+')';$('fit').style.height=(1000*s)+'px';st.style.marginLeft=(s===1?Math.max(0,(w-940)/2):0)+'px';}
window.addEventListener('resize',fit);render();fit();
})();
</script>
</body>
</html>
