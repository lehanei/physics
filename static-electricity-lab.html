  b.innerHTML=`<span class="n">${i+1}</span><span class="t">${a.t}</span><span class="d">${a.d}</span>`;
  b.onclick=()=>show(i);menu.appendChild(b);});
function syncTheme(){try{const d=view.contentDocument.documentElement,v=document.documentElement.getAttribute('data-theme');
  v?d.setAttribute('data-theme',v):d.removeAttribute('data-theme');}catch(e){}}
function fit(){try{const h=view.contentDocument.documentElement.scrollHeight;if(h)view.style.height=h+'px';}catch(e){}}

  try{ro=new ResizeObserver(fit);ro.observe(view.contentDocument.body);}catch(e){}});
function show(i){if(i===cur)return;cur=i;
  [...menu.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  view.title=ANIMS[i].t;view.srcdoc=HEAD+dec(DATA[i])+'</body></html>';
  try{history.replaceState(null,'','#'+ANIMS[i].id);}catch(e){}}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
