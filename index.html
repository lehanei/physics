<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBC Physics Applets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, year → term → chapter, applets as a wrapping grid of link cards */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1a242c; --muted:#5b6872; --line:#cdd5db; --copper:#b2622a; --band:#dfe6eb;
  --f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171b; --panel:#182127; --ink:#dfe7ec; --muted:#93a1ab; --line:#2f3d46; --copper:#e08d4f; --band:#1d282f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 56px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--copper);font-size:14px}
h1{font-family:var(--f-display);font-size:clamp(32px,6vw,46px);line-height:1.05;margin:4px 0 8px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 28px}
h2{font-family:var(--f-display);font-size:28px;margin:32px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--copper)}
h3{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.chapter{background:var(--band);border-radius:8px;padding:6px 10px;font-weight:600;margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
a.card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--copper);outline:none}
a.card strong{font-size:16px}
a.card span{color:var(--muted);font-size:14px}
a.card .go{color:var(--copper);font-weight:600;font-size:13px;margin-top:auto}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">PBC Science · Leaving Certificate Physics</div>
  <h1>Physics Applets</h1>
  <p class="lede">Interactive models and virtual experiments, in the order we cover them. They work on laptops, Chromebooks, tablets and phones.</p>
  <main id="list"></main>
  <footer>New applets are added as the course goes on.</footer>
</div>
<script>
const SITE=[
 {year:"5th year",terms:[
  {term:"Term 1",chapters:[
   ["Ch 14 Heat Transfer and Temperature Change",[
    ["heating-curve-lab","Heating Curve Lab","Heat a substance, watch its particles and build its heating curve."],
    ["method-of-mixtures-lab","Method of Mixtures Lab","Mix bodies at different temperatures and watch energy flow until they are equal."],
    ["hot-rivets-calorimeter","Hot Rivets in a Calorimeter","Hot copper rivets dropped into water: track the energy lost and gained."]]],
   ["Ch 3 Refraction of Light",[
    ["thumb-forefinger-refraction","Thumb and Forefinger Refraction","Why a wave bends: one side of the wavefront changes speed first."],
    ["refraction-explorer","Refraction Explorer","Trace rays across a boundary and find the critical angle."],
    ["snells-law-lab","Snell's Law Lab","Experiment: verify Snell's law and find the refractive index of glass."],
    ["critical-angle-lab","Critical Angle Lab","Experiment: measure the critical angle and verify n = 1/sin C."]]],
   ["Ch 4 Lenses",[
    ["lens-ray-tracer","Lens Ray Tracer","Ray diagrams for converging and diverging lenses, and the eye."],
    ["lens-formula-lab","Lens Formula Lab","Experiment: verify 1/f = 1/u + 1/v and find the focal length."]]],
   ["Ch 15 Waves and Wave Motion",[
    ["slinky-wave-lab","Slinky Wave Lab","Send transverse and longitudinal waves along a slinky."]]]]},
  {term:"Term 2",chapters:[
   ["Ch 17 The Wave Nature of Light",[
    ["polarisation-at-a-boundary","Polarisation at a Boundary","See which vibrations reflect and which refract at glass."]]]]}]},
 {year:"6th year",terms:[
  {term:"Term 1",chapters:[
   ["Ch 18 Static Electricity",[
    ["static-electricity-lab","Static Electricity Lab","All four static electricity animations in one place."],
    ["charge-in-insulators","Charge in Insulators","What happens to the atoms when an insulator is charged."],
    ["gold-leaf-electroscope","Gold Leaf Electroscope","Bring a charged rod near and earth the cap: charging by induction."],
    ["charge-blanket-model","Charge Blanket Model","A stretchy-blanket model of electric fields, compared with gravity."],
    ["point-effect","Point Effect","Why charge crowds at a point and the field there is strongest."]]],
   ["Ch 20 Current and Charge",[
    ["marble-ramp-circuit","Marble Ramp Circuit","Electrons as marbles, potential difference as height."],
    ["digital-multimeter","Digital Multimeter","Choose the right dial setting and sockets to measure V, I and R."]]],
   ["Ch 22 Resistance",[
    ["plug-into-potentials","Plug Into Potentials","Build the potential-divider circuit for I–V experiments."]]],
   ["Ch 24 Semiconductors",[
    ["breadboard","Breadboard","Place resistors, LEDs, diodes and transistors; lift the cover to see the connections."]]]]}]}
];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("list").innerHTML=SITE.map(y=>`<section><h2>${y.year}</h2>${y.terms.map(t=>`<h3>${t.term}</h3>${t.chapters.map(([ch,apps])=>`<div class="chapter">${esc(ch)}</div><div class="grid">${apps.map(([f,n,d])=>`<a class="card" href="${f}.html"><strong>${esc(n)}</strong><span>${esc(d)}</span><span class="go">Open →</span></a>`).join("")}</div>`).join("")}`).join("")}</section>`).join("");
</script>
</body>
</html>
