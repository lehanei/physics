<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gold Leaf Electroscope</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: same lab bench as Animation 1 — live stage, controls beneath, explanation + induction guide below. */
:root{
  --bg:#e9eef1; --surface:#fbfcfd; --fg:#15212a; --muted:#566773; --line:#c8d2d9;
  --pos:#c4362b; --pos-soft:rgba(196,54,43,.24); --neg:#2160c4; --neg-soft:rgba(33,96,196,.24);
  --accent:#0e7466; --accent-ink:#ffffff; --on-color:#ffffff;
  --rod-a:#d3dce2; --rod-b:#eadfb8; --metal:#a9b4bc; --gold:#d4a72c; --glass:rgba(120,160,180,.08); --stopper:#7c6a58;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --fg:#e4ebef; --muted:#93a5b1; --line:#2c3a44;
  --pos:#f0695d; --pos-soft:rgba(240,105,93,.26); --neg:#6fa3ff; --neg-soft:rgba(111,163,255,.26);
  --accent:#37bfa9; --accent-ink:#06201b; --on-color:#0f161b;
  --rod-a:#3a4752; --rod-b:#4d4630; --metal:#5d6b75; --gold:#e2b84a; --glass:rgba(140,190,210,.07); --stopper:#8a7560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --fg:#e4ebef; --muted:#93a5b1; --line:#2c3a44;
  --pos:#f0695d; --pos-soft:rgba(240,105,93,.26); --neg:#6fa3ff; --neg-soft:rgba(111,163,255,.26);
  --accent:#37bfa9; --accent-ink:#06201b; --on-color:#0f161b;
  --rod-a:#3a4752; --rod-b:#4d4630; --metal:#5d6b75; --gold:#e2b84a; --glass:rgba(140,190,210,.07); --stopper:#8a7560; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:900/500;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.group{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.group.grow{flex:1;min-width:220px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:16px;width:40px;padding:5px 0;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"].n{background:var(--neg);color:var(--on-color)}
.seg button[aria-pressed="true"].p{background:var(--pos);color:var(--on-color)}
.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.below{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:760px){.below{grid-template-columns:1fr}}
.now{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.now h2,.guide h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.now p{margin:0;max-width:65ch}
.guide{display:flex;flex-direction:column;gap:8px}
.guide ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.guide li{counter-increment:s}
.guide li button{font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;
  padding:9px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.guide li button::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.3}
.guide li.next button{background:var(--surface);border-color:var(--accent);color:var(--fg)}
.guide li.next button::before{color:var(--accent)}

.guide li.done button::before{content:"✓";color:var(--accent)}
.guide .done-note{font-size:14px;color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.key{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--on-color);font-weight:700;font-size:12px;line-height:1}
.dot.p{background:var(--pos)} .dot.n{background:var(--neg);width:12px;height:12px}
.dot.g{background:var(--pos);box-shadow:0 0 0 4px var(--pos-soft);width:12px;height:12px}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Static electricity · Animation 2</p>
    <h1>Gold Leaf Electroscope</h1>
  </header>

  <figure class="stage">
    <canvas id="cv" aria-label="Gold leaf electroscope simulation"></canvas>
    <div class="bar">
      <div class="group">Rod charge
        <div class="seg"><button class="n" id="sn" aria-pressed="true" aria-label="Negative rod">−</button><button class="p" id="sp" aria-pressed="false" aria-label="Positive rod">+</button></div>
      </div>
      <label class="group grow" for="rod">Far<input type="range" id="rod" min="0" max="100" value="0">Near</label>
      <button class="btn" id="earth" aria-pressed="false">Earth the cap</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </figure>

  <div class="legend">
    <span class="key"><span class="dot p">+</span>Positive metal ion (fixed)</span>
    <span class="key"><span class="dot n"></span>Free electron</span>
    <span class="key"><span class="dot g"></span>Ion missing its electron</span>
  </div>

  <div class="below">
    <section class="now" aria-live="polite">
      <h2>What's happening</h2>
      <p id="explain"></p>
    </section>
    <section class="guide">
      <h2>Charging by induction</h2>
      <ol id="guide"></ol>
      <p class="done-note" id="gnote"></p>
    </section>
  </div>
</div>

<script>
(()=>{
const W=900,H=500;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let C={};
function readColors(){const s=getComputedStyle(document.documentElement);
  ['surface','fg','muted','line','pos','pos-soft','neg','neg-soft','accent','on-color','rod-a','rod-b','metal','gold','glass','stopper']
  .forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,s)=>a+(b-a)*s;
const fmt=q=>q===0?'0':(q>0?'+'+q+'e':'−'+(-q)+'e');
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function disc(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}
function ion(x,y,glow){if(glow)disc(x,y,12,C['pos-soft']);disc(x,y,7,C.pos);ctx.strokeStyle=C['on-color'];ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(x-3.5,y);ctx.lineTo(x+3.5,y);ctx.moveTo(x,y-3.5);ctx.lineTo(x,y+3.5);ctx.stroke();}
function electron(x,y){disc(x,y,5.5,C.neg);ctx.strokeStyle=C['on-color'];ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.stroke();}
function text(s,x,y,{align='left',col=C.fg,size=14,weight=700}={}){ctx.fillStyle=col;ctx.font=`${weight} ${size}px "Atkinson Hyperlegible", sans-serif`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}

// ---------- geometry ----------
// regions along the conductor chain: 0 earth, 1 wire (vertical), 2 wire (horizontal), 3 cap, 4 stem, 5 plate + leaf
const GND={x:200,y:440},BEND={x:200,y:150},J0={x:360,y:150},J1={x:450,y:167},J2={x:450,y:325};
const JUN=[GND,BEND,J0,J1,J2];
const HINGE={x:457,y:332};
let theta=0; // leaf angle (rad)
const leafDir=()=>({x:Math.sin(theta),y:Math.cos(theta)});
const leafPt=(dist,perp)=>{const d=leafDir();return{x:HINGE.x+d.x*dist+d.y*perp,y:HINGE.y+d.y*dist-d.x*perp};};

const capIons=[...Array(7)].map((_,i)=>({x:372+i*26,y:142}));
const stemIons=[182,240,270,300].map(y=>({x:450,y}));
const plateIons=[340,364,388,412].map(y=>({x:450,y}));
const leafD=[24,50,76];
// paired electron positions
const capPair=i=>()=>({x:capIons[i].x,y:158});
const stemPair=i=>()=>({x:437,y:stemIons[i].y});
const platePair=i=>()=>({x:437,y:plateIons[i].y});
const leafPair=i=>()=>leafPt(leafD[i],12);
// ions to draw: {pos(), pairPos()}
const IONS=[
  ...capIons.map((p,i)=>({pos:()=>p,pair:capPair(i)})),
  ...stemIons.map((p,i)=>({pos:()=>p,pair:stemPair(i)})),
  ...plateIons.map((p,i)=>({pos:()=>p,pair:platePair(i)})),
  ...leafD.map((d,i)=>({pos:()=>leafPt(d,0),pair:leafPair(i)}))];
const N=IONS.length; // 18

function buildSlots(capN,leafN){
  const s=[];
  const capOrder=[3,2,4,1,5,0,6];
  for(let k=0;k<Math.min(capN,7);k++){const i=capOrder[k];s.push({reg:3,coord:3000+capIons[i].x,pos:capPair(i)});}
  const capExtra=[2,3,1,4,0,5];
  for(let k=0;k<capN-7;k++){const i=capExtra[k];const x=capIons[i].x+13;s.push({reg:3,coord:3000+x,pos:()=>({x,y:150})});}
  stemIons.forEach((p,i)=>s.push({reg:4,coord:4000+p.y,pos:stemPair(i)}));
  const leafOrder=[['p',0],['l',0],['p',1],['l',1],['p',2],['l',2],['p',3]];
  for(let k=0;k<Math.min(leafN,7);k++){const [t,i]=leafOrder[k];
    s.push(t==='p'?{reg:5,coord:5000+plateIons[i].y-325,pos:platePair(i)}:{reg:5,coord:5000+leafD[i],pos:leafPair(i)});}
  const leafExtra=[['l',37],['p',0],['l',63],['p',1],['l',89],['p',2]];
  for(let k=0;k<leafN-7;k++){const [t,v]=leafExtra[k];
    s.push(t==='l'?{reg:5,coord:5000+v,pos:()=>leafPt(v,12)}:{reg:5,coord:5000+plateIons[v].y-313,pos:()=>({x:437,y:plateIons[v].y+12})});}
  return s;
}
const coordOf=e=>[0,1000+(440-e.y),2000+e.x,3000+e.x,4000+e.y,5000+(e.y-325)][e.reg];

// ---------- state ----------
let sign=-1,rodS=0,rodT=0,earthed=false,Ebase=0,electrons=[],lastKey='',progress=0;
function D(){return Math.round(3*rodS*rodS);}
function config(){
  const d=-sign*D();               // electrons pushed toward the leaf (neg rod) or pulled to the cap (pos rod)
  const E=earthed?-d:Ebase;        // excess electrons on the electroscope
  let capEx,leafEx;
  if(D()>0){capEx=-d;leafEx=E+d;}
  else{leafEx=E>0?Math.ceil(E/2):-Math.ceil(-E/2);capEx=E-leafEx;}
  return{d,E,capN:7+capEx,leafN:7+leafEx,Ne:N+E};
}
function route(e,q,final){
  const r0=e.reg,out=[];let r=r0;
  while(r<q){out.push({p:JUN[r],reg:r+1});r++;}
  while(r>q){out.push({p:JUN[r-1],reg:r-1});r--;}
  out.push({p:final,reg:q,final:true});
  return out;
}
function reassign(cfg){
  const slots=buildSlots(cfg.capN,cfg.leafN);
  while(electrons.length<cfg.Ne)electrons.push({x:GND.x,y:GND.y,reg:0,route:[]});
  const targets=slots.slice();
  for(let k=0;k<electrons.length-cfg.Ne;k++)targets.push({reg:0,coord:-1,ground:true,pos:()=>GND});
  targets.sort((a,b)=>a.coord-b.coord);
  const es=electrons.slice().sort((a,b)=>coordOf(a)-coordOf(b));
  es.forEach((e,i)=>{const t=targets[i];e.toGround=!!t.ground;e.route=route(e,t.reg,t.pos);});
}
function reset(){
  sign=-1;rodS=rodT=0;earthed=false;Ebase=0;progress=0;theta=0;
  electrons=buildSlots(7,7).map(s=>{const p=s.pos();return{x:p.x,y:p.y,reg:s.reg,route:[{p:s.pos,reg:s.reg,final:true}]};});
  lastKey='';syncUI();
}
function setEarth(on){
  if(on===earthed)return;
  earthed=on;
  if(!on){ // anything already in the wire heading to earth has gone
    electrons=electrons.filter(e=>!(e.toGround&&e.reg<=2));
    Ebase=electrons.length-N;
  }
  lastKey='';syncUI();
}

// ---------- motion ----------
function step(dt){
  rodS+= (rodT-rodS)*Math.min(1,dt*(reduce?60:3));
  if(Math.abs(rodT-rodS)<0.002)rodS=rodT;
  const cfg=config();const key=cfg.capN+','+cfg.leafN+','+cfg.Ne+','+earthed;
  if(key!==lastKey){lastKey=key;reassign(cfg);}
  const speed=reduce?1e6:240;
  electrons=electrons.filter(e=>{
    let budget=speed*dt;
    while(e.route.length&&budget>0){
      const w=e.route[0];const p=typeof w.p==='function'?w.p():w.p;
      const dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);
      if(dist<=budget){e.x=p.x;e.y=p.y;e.reg=w.reg;budget-=dist;
        if(w.final){if(e.toGround)return false;break;}
        e.route.shift();}
      else{e.x+=dx/dist*budget;e.y+=dy/dist*budget;budget=0;}
    }
    return true;
  });
  const leafQ=7-electrons.filter(e=>e.reg===5).length;
  const target=Math.min(50,13*Math.abs(leafQ))*Math.PI/180;
  theta+=(target-theta)*Math.min(1,dt*(reduce?60:4));
  // induction guide progress
  const near=rodS>0.9;
  if(progress===0&&near&&!earthed)progress=1;
  else if(progress===1&&earthed&&near)progress=2;
  else if(progress===2&&!earthed&&near)progress=3;
  else if(progress===3&&rodS<0.05&&!earthed)progress=4;
  if((progress===1||progress===2)&&rodS<0.5)progress=0;
  if(progress===3&&earthed)progress=2;
}

// ---------- drawing ----------
function draw(){
  ctx.fillStyle=C.surface;ctx.fillRect(0,0,W,H);
  // glass case
  rr(290,205,320,265,12);ctx.fillStyle=C.glass;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.stroke();
  text('Glass case',600,488,{align:'right',col:C.muted,weight:400});
  // earth wire + switch
  const wc=earthed?C.fg:C.muted;
  ctx.strokeStyle=wc;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GND.x,GND.y-12);ctx.lineTo(BEND.x,BEND.y);ctx.lineTo(290,150);ctx.stroke();
  ctx.beginPath();ctx.moveTo(325,150);ctx.lineTo(J0.x,J0.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(290,150);
  if(earthed)ctx.lineTo(325,150);else ctx.lineTo(290+31*Math.cos(-0.6),150+31*Math.sin(-0.6));ctx.stroke();
  disc(290,150,4,wc);disc(325,150,4,wc);
  ctx.lineWidth=3;[[22,428],[14,436],[6,444]].forEach(([w,y])=>{ctx.beginPath();ctx.moveTo(GND.x-w,y);ctx.lineTo(GND.x+w,y);ctx.stroke();});
  text('Earth',GND.x,466,{align:'center',col:wc});
  text(earthed?'Earth connected':'Earth switch open',307,126,{align:'center',col:wc,weight:400,size:13});
  // stopper
  rr(428,196,44,20,4);ctx.fillStyle=C.stopper;ctx.fill();
  text('Insulator',420,206,{align:'right',col:C.muted,weight:400,size:13});
  // metal parts
  ctx.fillStyle=C.metal;
  rr(360,133,180,34,8);ctx.fill();
  ctx.fillRect(443,165,14,165);
  ctx.fillRect(443,325,14,103);
  // gold leaf
  ctx.save();ctx.translate(HINGE.x,HINGE.y);ctx.rotate(-theta);
  ctx.fillStyle=C.gold;ctx.fillRect(-1,0,6,95);ctx.restore();
  text('Cap',548,150,{col:C.muted,weight:400});
  text('Metal stem',466,262,{col:C.muted,weight:400,size:13});
  text('Gold leaf',HINGE.x+Math.sin(theta)*95+10,HINGE.y+Math.cos(theta)*95+8,{col:C.muted,weight:400,size:13});
  // ions (glow if their electron is missing)
  IONS.forEach(io=>{const p=io.pos(),q=io.pair();
    const has=electrons.some(e=>Math.abs(e.x-q.x)<6&&Math.abs(e.y-q.y)<6);ion(p.x,p.y,!has);});
  electrons.forEach(e=>electron(e.x,e.y));
  // rod
  const yb=lerp(-12,112,rodS);
  if(yb>0){
    rr(330,yb-46,240,46,23);ctx.fillStyle=sign<0?C['rod-a']:C['rod-b'];ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();
    for(let i=0;i<6;i++){const x=360+i*36,y=yb-23;sign<0?electron(x,y):ion(x,y,false);}
  }
  // readout
  const Q=N-electrons.filter(e=>e.reg>=3).length;
  const leafQ=7-electrons.filter(e=>e.reg===5).length;
  text('Electroscope net charge',650,250,{col:C.muted,weight:400,size:13});
  text(fmt(Q),650,276,{size:24,col:Q>0?C.pos:Q<0?C.neg:C.fg});
  text('Leaf and plate',650,316,{col:C.muted,weight:400,size:13});
  text(fmt(leafQ),650,342,{size:24,col:leafQ>0?C.pos:leafQ<0?C.neg:C.fg});
  text(theta>0.05?'Leaf diverges':'Leaf collapsed',650,372,{col:C.muted,weight:400,size:13});
}

// ---------- explanation ----------
function explain(){
  const cfg=config();const Dn=D();const rod=sign<0?'negative':'positive';
  const Q=-cfg.E; // net charge in e
  if(earthed&&Dn>0)return sign<0
    ?'Earthing gives the repelled electrons a path out, and they flow down the wire to earth. The leaf loses its excess charge and collapses. The cap stays positive: that charge is held there by the attraction of the negative rod.'
    :'Electrons flow up from earth, attracted by the positive rod. They neutralise the leaf, which collapses. The extra electrons collect on the cap, held there by the rod.';
  if(earthed)return 'The electroscope is earthed. Any excess charge flows to or from earth until the electroscope is neutral, so the leaf hangs straight.';
  if(Dn===0&&Q===0)return 'The electroscope is neutral. The metal is a conductor: it contains free electrons that can move, unlike the bound electrons in an insulator. Every positive ion is matched by an electron, so the leaf has no net charge and hangs straight.';
  if(Dn===0)return `The electroscope now has a net charge of ${fmt(Q)}. With no rod nearby this charge spreads over the whole conductor. The leaf and plate carry like charges, so they repel and the leaf diverges.${progress===4?' This is charging by induction: the charge is opposite to the rod that was used, and the rod never touched the cap.':''}`;
  if(Q===0)return sign<0
    ?'The negative rod repels free electrons in the metal. They move down the stem to the plate and leaf, leaving the cap positive. The plate and leaf are both negative, so they repel and the leaf diverges. The electroscope as a whole is still neutral.'
    :'The positive rod attracts free electrons up the stem to the cap. The plate and leaf are left positive, so they repel and the leaf diverges. The electroscope as a whole is still neutral.';
  const same=(Q>0&&sign>0)||(Q<0&&sign<0);
  return same
    ?`The electroscope is already charged (${fmt(Q)}). A ${rod} rod has the same sign, so it drives more charge onto the leaf and plate: the divergence increases. This is how an electroscope identifies the sign of a charge.`
    :`The electroscope is already charged (${fmt(Q)}). A ${rod} rod has the opposite sign, so it draws charge away from the leaf and plate towards the cap: the divergence decreases.`;
}

// ---------- UI ----------
const rodIn=document.getElementById('rod'),earthBtn=document.getElementById('earth');
const sn=document.getElementById('sn'),sp=document.getElementById('sp'),explainEl=document.getElementById('explain');
const GUIDE=[
  {t:'Bring a charged rod near the cap (do not touch).',go:()=>{earthed&&setEarth(false);rodT=1;}},
  {t:'Earth the cap, as if touching it with a finger.',go:()=>{rodT=1;setEarth(true);}},
  {t:'Remove the earth while the rod is still in place.',go:()=>setEarth(false)},
  {t:'Take the rod away.',go:()=>{setEarth(false);rodT=0;}}];
const gEl=document.getElementById('guide'),gNote=document.getElementById('gnote');
GUIDE.forEach(g=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=g.t;
  b.onclick=()=>{g.go();syncUI();};li.appendChild(b);gEl.appendChild(li);});
function syncUI(){
  sn.setAttribute('aria-pressed',sign<0);sp.setAttribute('aria-pressed',sign>0);
  earthBtn.setAttribute('aria-pressed',earthed);earthBtn.textContent=earthed?'Remove earth':'Earth the cap';
}
let lastExplain='',lastProg=-1;
function syncText(){
  const ex=explain();if(ex!==lastExplain){lastExplain=ex;explainEl.textContent=ex;}
  if(document.activeElement!==rodIn)rodIn.value=Math.round(rodT*100);
  if(progress!==lastProg){lastProg=progress;
    [...gEl.children].forEach((li,i)=>{li.classList.toggle('done',i<progress);li.classList.toggle('next',i===progress);});
    gNote.textContent=progress===4?'Done. The electroscope is charged by induction, with the opposite sign to the rod. Reset to try it with the other rod.':'';}
}
sn.onclick=()=>{sign=-1;syncUI();};sp.onclick=()=>{sign=1;syncUI();};
rodIn.oninput=()=>{rodT=rodIn.value/100;};
earthBtn.onclick=()=>setEarth(!earthed);
document.getElementById('reset').onclick=reset;

function resize(){const w=cv.getBoundingClientRect().width,d=devicePixelRatio||1;cv.width=Math.round(w*d);cv.height=Math.round(w*H/W*d);}
new ResizeObserver(resize).observe(cv);
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  step(dt);const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);draw();syncText();requestAnimationFrame(frame);}
reset();requestAnimationFrame(frame);
})();
</script>
